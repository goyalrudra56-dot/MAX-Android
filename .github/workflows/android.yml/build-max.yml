
name: Build MAX APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'MAX_Android_Project/**'
      -       - '.github/workflows/build-max.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MAX APK
        run: |
          cd MAX_Android_Project/MAX_Android_Project
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MAX-debug-APK
          path: MAX_Android_Project/MAX_Android_Project/app/build/outputs/apk/debug/*.apk
          
